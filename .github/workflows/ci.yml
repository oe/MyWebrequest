name: Quality gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium --no-shell
      - run: pnpm exec playwright install-deps firefox
      - run: pnpm release:package
      - name: Verify Chromium installation floor
        run: |
          floor_version=$(jq -r .chromeForTestingFloor browser-support.json)
          floor_dir="$RUNNER_TEMP/chrome-floor"
          mkdir -p "$floor_dir"
          curl -fL --retry 3 \
            -o "$floor_dir/chrome.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$floor_version/linux64/chrome-linux64.zip"
          unzip -q "$floor_dir/chrome.zip" -d "$floor_dir"
          extension_archive=$(find dist -maxdepth 1 -name '*-chrome.zip' -print -quit)
          mkdir -p "$floor_dir/extension"
          unzip -q "$extension_archive" -d "$floor_dir/extension"
          "$floor_dir/chrome-linux64/chrome" --version | tee "$RUNNER_TEMP/chrome-floor-version.txt"
          xvfb-run -a env \
            MWR_CHROMIUM_HEADED=1 \
            MWR_CHROMIUM_EXECUTABLE_PATH="$floor_dir/chrome-linux64/chrome" \
            MWR_BROWSER_TARGET=chrome \
            MWR_EXTENSION_PATH="$floor_dir/extension" \
            pnpm e2e:chromium:run
      - name: Verify Edge installation and runtime floor
        run: |
          floor_version=$(jq -r .edgeFloorPackageVersion browser-support.json)
          floor_checksum=$(jq -r .edgeLinux64Sha256 browser-support.json)
          floor_dir="$RUNNER_TEMP/edge-floor"
          mkdir -p "$floor_dir/browser" "$floor_dir/extension"
          curl -fL --retry 3 \
            -o "$floor_dir/edge.deb" \
            "https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_${floor_version}_amd64.deb"
          echo "$floor_checksum  $floor_dir/edge.deb" | sha256sum --check --strict
          dpkg-deb --extract "$floor_dir/edge.deb" "$floor_dir/browser"
          extension_archive=$(find dist -maxdepth 1 -name '*-edge.zip' -print -quit)
          unzip -q "$extension_archive" -d "$floor_dir/extension"
          "$floor_dir/browser/opt/microsoft/msedge/msedge" --version | tee "$RUNNER_TEMP/edge-floor-version.txt"
          xvfb-run -a env \
            MWR_CHROMIUM_HEADED=1 \
            MWR_CHROMIUM_EXECUTABLE_PATH="$floor_dir/browser/opt/microsoft/msedge/msedge" \
            MWR_BROWSER_TARGET=edge \
            MWR_EXTENSION_PATH="$floor_dir/extension" \
            pnpm e2e:chromium:run
      - name: Verify Firefox installation and runtime floor
        run: |
          floor_version=$(jq -r .firefoxMinimum browser-support.json)
          driver_version=$(jq -r .geckodriverVersion browser-support.json)
          driver_checksum=$(jq -r .geckodriverLinux64Sha256 browser-support.json)
          floor_dir="$RUNNER_TEMP/firefox-floor"
          mkdir -p "$floor_dir"
          curl -fL --retry 3 \
            -o "$floor_dir/firefox.tar.xz" \
            "https://archive.mozilla.org/pub/firefox/releases/$floor_version/linux-x86_64/en-US/firefox-$floor_version.tar.xz"
          tar -xJf "$floor_dir/firefox.tar.xz" -C "$floor_dir"
          "$floor_dir/firefox/firefox" --version | tee "$RUNNER_TEMP/firefox-floor-version.txt"
          MWR_FIREFOX_EXECUTABLE_PATH="$floor_dir/firefox/firefox" pnpm verify:firefox-floor
          curl -fL --retry 3 \
            -o "$floor_dir/geckodriver.tar.gz" \
            "https://github.com/mozilla/geckodriver/releases/download/v$driver_version/geckodriver-v$driver_version-linux64.tar.gz"
          echo "$driver_checksum  $floor_dir/geckodriver.tar.gz" | sha256sum --check --strict
          tar -xzf "$floor_dir/geckodriver.tar.gz" -C "$floor_dir"
          MWR_FIREFOX_EXECUTABLE_PATH="$floor_dir/firefox/firefox" \
            MWR_GECKODRIVER_PATH="$floor_dir/geckodriver" \
            pnpm verify:firefox-runtime
      - name: Write native x86 browser floor certification
        run: |
          MWR_CHROME_OBSERVED_VERSION="$(cat "$RUNNER_TEMP/chrome-floor-version.txt")" \
          MWR_EDGE_OBSERVED_VERSION="$(cat "$RUNNER_TEMP/edge-floor-version.txt")" \
          MWR_FIREFOX_OBSERVED_VERSION="$(cat "$RUNNER_TEMP/firefox-floor-version.txt")" \
            node scripts/write-floor-certification.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser-release-candidates-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/browser-floor-certification.json
          if-no-files-found: error
          retention-days: 14
